[package]
name = "lib-inventory"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.*", default-features = false, features = ["dynamic_linking", "2d"] }
serde = "1.0.*"
strum = { version = "0.28.*", features = ["derive"] }

[dependencies.lib-core]
path = "../lib-core"

[dependencies.lib-grid]
path = "../lib-grid"

[dependencies.lib-derive]
path = "../lib-derive"
